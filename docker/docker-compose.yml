version: "3.9"

services:
  # ── Main API Service ────────────────────────────────────────────────────────
  sentiment-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentiment-analysis:1.0.0
    container_name: sentiment_api
    ports:
      - "8000:8000"
    environment:
      - MODEL_DIR=src/models/saved
      - LOG_LEVEL=INFO
      - PORT=8000
    volumes:
      - ./src/models/saved:/app/src/models/saved:ro
      - ./monitoring/logs:/app/monitoring/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - sentiment-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          memory: 512M

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sentiment_nginx
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - sentiment-api
    restart: unless-stopped
    networks:
      - sentiment-net

networks:
  sentiment-net:
    driver: bridge

volumes:
  model-data:
  log-data:
